[platformio]
default_envs = esp32cam-stream

[env:esp32cam-stream]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM12
monitor_port = COM12
upload_flags =
    --before=no_reset
    --after=no_reset
extra_scripts =
    pre:../Shared/load_env.py
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I../Shared
