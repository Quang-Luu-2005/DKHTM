[platformio]
default_envs = esp32cam-stream
src_dir = src

; ====================================================================
; 1. ESP32-CAM Video Stream Server & Face Detect
; ====================================================================
[env:esp32cam-stream]
platform = espressif32
board = esp32cam
framework = arduino
build_src_filter = +<ESP-CAM-Stream/src/*>
monitor_speed = 115200
upload_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:src/Shared/load_env.py
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Isrc/Shared
	-Isrc/ESP-CAM-Stream/include

; ====================================================================
; 2. ESP32-CAM High Frame-Rate Face Recognition
; ====================================================================
[env:hfr-s16]
platform = espressif32
board = esp32cam
framework = arduino
build_src_filter = +<ESP32-CAM-HFR/src/*>
monitor_speed = 115200
upload_speed = 460800
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = src/ESP32-CAM-HFR/partitions.csv
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:src/Shared/load_env.py
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Isrc/Shared
	-Isrc/ESP32-CAM-HFR/include
	-DHFR_QUANT_S16=1

; ====================================================================
; 3. ESP32 Automatic Gate Controller (RFID, Ultrasonic, Servo, MQTT)
; ====================================================================
[env:esp32-gate]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<ESP32-Automatic-Gate/src/*>
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
extra_scripts = pre:src/Shared/load_env.py
build_flags = 
	-Isrc/Shared
	-Isrc/ESP32-Automatic-Gate/include
lib_deps = 
	WiFiClientSecure
	knolleary/PubSubClient@^2.8
	madhephaestus/ESP32Servo@^3.0.6
	miguelbalboa/MFRC522@^1.4.11
	bblanchon/ArduinoJson@^7.0.4
